<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard">

    <aside class="sidebar">
      <div class="sidebar-logo">SpendWise</div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active">Dashboard</a>
        <a href="#" class="nav-item">Expenses</a>
        <a href="#" class="nav-item">Budgets</a>
        <a href="#" class="nav-item">Reports</a>
        <a href="#" class="nav-item">Settings</a>
      </nav>
    </aside>

    <header class="topbar">
      <h1>Dashboard</h1>
      <div class="topbar-user">
        <span>Ibrahim Adow</span>
        <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="User avatar" width="36">
      </div>
    </header>

    <main class="cards-grid">

      <div class="card" tabindex="0">
        <h3>Food</h3>
        <p class="amount">$320.00</p>
        <p class="label">This month</p>
      </div>

      <div class="card" tabindex="0">
        <h3>Transport</h3>
        <p class="amount">$120.00</p>
        <p class="label">This month</p>
      </div>

      <div class="card" tabindex="0">
        <h3>Rent</h3>
        <p class="amount">$500.00</p>
        <p class="label">This month</p>
      </div>

      <div class="card" tabindex="0">
        <h3>Entertainment</h3>
        <p class="amount">$85.00</p>
        <p class="label">This month</p>
      </div>

      <div class="card" tabindex="0">
        <h3>Savings</h3>
        <p class="amount">$400.00</p>
        <p class="label">This month</p>
      </div>

      <div class="card" tabindex="0">
        <h3>Utilities</h3>
        <p class="amount">$150.00</p>
        <p class="label">This month</p>
      </div>

    </main>

  </div>

</body>
</html>
