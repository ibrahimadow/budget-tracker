<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>My Budget Tracker</h1>
  <p class="subheading">Track your income and expenses in one place.</p>

  <section id="add-expense" class="card">
    <h2>Add Expense</h2>
    <input type="text" class="input-field" placeholder="Expense name">
    <input type="number" class="input-field" placeholder="Amount">
    <input type="text" class="input-field" placeholder="Category">
  </section>

  <section id="your-expenses" class="card">
    <h2>Your Expenses</h2>
    <p class="placeholder-text">No expenses yet</p>
  </section>

</body>
</html>
