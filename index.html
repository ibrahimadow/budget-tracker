<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard">

    <aside class="sidebar">
      <div class="sidebar-logo">SpendWise</div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active">Dashboard</a>
        <a href="#" class="nav-item">Expenses</a>
        <a href="#" class="nav-item">Budgets</a>
        <a href="#" class="nav-item">Reports</a>
        <a href="#" class="nav-item">Settings</a>
      </nav>
    </aside>

    <header class="topbar">
      <h1>Dashboard</h1>
      <div class="topbar-user">
        <span>Ibrahim Adow</span>
        <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="User avatar" width="36">
      </div>
    </header>

    <main class="main-content">

      <section class="budget-summary card" id="budget-summary">
        <h2>Budget Summary</h2>
        <p><strong>Monthly Budget:</strong> $<span id="budget-amount">1500.00</span></p>
        <p><strong>Total Spent:</strong> $<span id="total-spent">0.00</span></p>
        <p><strong>Remaining:</strong> $<span id="remaining-balance">1500.00</span></p>
        <p id="budget-status" class="status-message"></p>
      </section>

      <section class="add-expense-form card">
        <h2>Add Expense</h2>
        <form id="expense-form">
          <input type="text" id="expense-name" placeholder="Expense name" required>
          <input type="number" id="expense-amount" placeholder="Amount" required>
          <select id="expense-category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Rent">Rent</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Savings">Savings</option>
            <option value="Utilities">Utilities</option>
            <option value="Other">Other</option>
          </select>
          <button type="submit" id="add-expense-btn">Add Expense</button>
        </form>
      </section>

      <section class="expenses-list card">
        <h2>Your Expenses</h2>
        <ul id="expenses-list">
          <!-- Expense items will be added here dynamically -->
        </ul>
      </section>

      <div class="cards-grid" id="cards-grid">
        <!-- Category summary cards will be added here dynamically -->
      </div>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
